---
- name: Configure Jenkins test and production agents
  hosts: agents
  become: true
  gather_facts: true

  vars:
    docker_architecture_map:
      x86_64: amd64
      aarch64: arm64

  pre_tasks:
    - name: Require Ubuntu 24.04
      ansible.builtin.assert:
        that:
          - ansible_distribution == 'Ubuntu'
          - ansible_distribution_version is version('24.04', '>=')
        fail_msg: This playbook is intended for Ubuntu 24.04 or a later Ubuntu release.

    - name: Set Docker repository architecture
      ansible.builtin.set_fact:
        docker_deb_architecture: "{{ docker_architecture_map[ansible_architecture] | default('amd64') }}"

  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install Git, Java 21, Python, and Docker prerequisites
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - git
          - openjdk-21-jdk
          - python3
        state: present

    - name: Create Docker keyring directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Install Docker signing key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'

    - name: Configure Docker apt repository
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/docker.sources
        mode: '0644'
        content: |
          Types: deb
          URIs: https://download.docker.com/linux/ubuntu
          Suites: {{ ansible_distribution_release }}
          Components: stable
          Architectures: {{ docker_deb_architecture }}
          Signed-By: /etc/apt/keyrings/docker.asc

    - name: Update apt cache after adding Docker repository
      ansible.builtin.apt:
        update_cache: true

    - name: Install Docker Engine
      ansible.builtin.apt:
        name:
          - containerd.io
          - docker-buildx-plugin
          - docker-ce
          - docker-ce-cli
          - docker-compose-plugin
        state: present

    - name: Enable and start Docker
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Allow ubuntu user to run Docker
      ansible.builtin.user:
        name: ubuntu
        groups: docker
        append: true
